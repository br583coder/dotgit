[package]
name = "dotgit"
version = "1.2.0"
edition = "2024"

[[bin]]
name = "dotgit"
path = "src/main.rs"

[[bin]]
name = "dg"
path = "src/bin/dg.rs"

# The TUI is a separate binary on purpose: `dotgit` never launches it, and
# nothing in the CLI depends on it being installed. It is also behind a
# non-default feature, so a plain build does not compile it or its dependency.
[[bin]]
name = "dotgit-tui"
path = "src/bin/dotgit-tui.rs"
required-features = ["tui"]

[features]
default = []
tui = ["dep:ratatui"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "5"
git2 = "0.19"
ratatui = { version = "0.30.2", optional = true }
thiserror = "2"
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
